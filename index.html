<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#020617" />
    <meta
      name="description"
      content="Swipe Rush by gamesCore_. A thirty-second swipe arcade. Slice products, chain combos, and avoid bombs."
    />
    <title>Swipe Rush · gamesCore_</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/fonts/recoleta-alt-bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main
      class="game-card"
      aria-label="Swipe Rush by gamesCore_"
      data-state="start"
    >
      <header class="status-strip">
        <div class="hud" hidden>
          <div class="score-stat">
            <span class="stat-label">SCORE</span><span id="score">0</span>
          </div>
          <div class="time-stat">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <circle cx="10" cy="11" r="6.5" />
              <path d="M10 7v4l2 1M8 1h4M10 1v3" /></svg
            ><span id="timer" aria-label="Seconds remaining">30</span
            ><span class="time-unit">s</span>
          </div>
        </div>
        <button
          id="mute"
          class="mute"
          type="button"
          aria-pressed="false"
          aria-label="Mute sound"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z" />
            <path
              class="wave"
              d="M15.5 9.5a3.6 3.6 0 0 1 0 5M18 7a7.2 7.2 0 0 1 0 10"
            />
            <path class="off" d="m16 9.5 5 5m0-5-5 5" />
          </svg>
        </button>
      </header>
      <div class="playfield">
        <canvas
          id="game"
          aria-label="Swipe playfield. Hold and drag across products; avoid round bombs with a fuse."
        ></canvas>
        <section class="screen start-screen" aria-labelledby="title">
          <h1 id="title">
            <span class="brand-wordmark">gamesCore<span>_</span></span
            >Swipe <span>Rush</span
            ><svg class="title-mark" viewBox="0 0 32 42" aria-hidden="true">
              <path d="M16 3 4 34M28 8 16 39" />
            </svg>
          </h1>
          <figure class="guide">
            <canvas
              id="guide"
              width="1000"
              height="330"
              aria-hidden="true"
            ></canvas>
            <figcaption>
              <p id="input-guide">
                One swipe at a time. Release and click to start again.
              </p>
              <p class="guide-secondary">
                Slice several products in one cut for combos.<br
                  class="mobile-break"
                />
                Avoid bombs.
              </p>
            </figcaption>
          </figure>
          <button id="start" type="button">
            Start Game
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h14m-6-6 6 6-6 6" />
            </svg>
          </button>
        </section>
        <section
          class="screen result-screen"
          aria-labelledby="result-title"
          hidden
        >
          <div class="result-heading">
            <span class="completion-mark" aria-hidden="true">✓</span>
            <h2 id="result-title">Round complete.</h2>
          </div>
          <div class="result-score">
            <span id="final-score">0</span><span>FINAL SCORE</span>
          </div>
          <button id="restart" type="button">
            Play Again
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h14m-6-6 6 6-6 6" />
            </svg>
          </button>
        </section>
      </div>
      <footer class="instruction-strip">
        <span hidden></span>
      </footer>
      <p id="announcement" class="sr-only" aria-live="polite"></p>
    </main>
    <script type="module" src="game.js"></script>
  </body>
</html>
